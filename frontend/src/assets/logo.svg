<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <!-- Outer circle -->
  <circle cx="50" cy="50" r="46" fill="#161614"/>

  <!-- Controller shape — clean geometric -->
  <g transform="translate(50,50)">

    <!-- Main body -->
    <rect x="-22" y="-12" width="44" height="24" rx="12" fill="#f8f7f5"/>

    <!-- Left grip -->
    <rect x="-26" y="2" width="13" height="18" rx="6.5" fill="#f8f7f5"/>

    <!-- Right grip -->
    <rect x="13" y="2" width="13" height="18" rx="6.5" fill="#f8f7f5"/>

    <!-- D-pad cross -->
    <rect x="-19" y="-4" width="11" height="4" rx="2" fill="#161614"/>
    <rect x="-15" y="-8" width="4" height="11" rx="2" fill="#161614"/>

    <!-- Face buttons — 4 circles -->
    <circle cx="13" cy="-5" r="2.5" fill="#161614"/>
    <circle cx="18" cy="0" r="2.5" fill="#161614"/>
    <circle cx="13" cy="5" r="2.5" fill="#161614"/>
    <circle cx="8" cy="0" r="2.5" fill="#161614"/>

    <!-- Center dots -->
    <circle cx="-2" cy="0" r="1.8" fill="#161614" opacity="0.4"/>
    <circle cx="2" cy="0" r="1.8" fill="#161614" opacity="0.4"/>

  </g>

</svg>
